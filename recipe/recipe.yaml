context:
  version: "2.0.3"

package:
  name: js-beautify
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/js-beautify/-/js-beautify-${{ version }}.tgz
  sha256: f687b307188ea030cf65f49cc56b036dd6344eb6fd9592907453d3f1a083ca6b

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - css-beautify --help
      - html-beautify --help
      - js-beautify --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Beautifier for javascript
  homepage: https://beautifier.io/
  repository: https://github.com/beautifier/js-beautify

extra:
  recipe-maintainers:
    - danielnachun
